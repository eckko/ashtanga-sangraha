<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" role="img"><title>Two columns: after intercourse, no delay in cleansing; with the mouth uncovered, no laughing, sneezing, belching, yawning</title><rect width="360" height="210" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">श्लोक ९३: दो निषेध</text><text x="93" y="52" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">मैथुन के बाद</text><rect x="16" y="64" width="154" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="93.0" y="82.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">शौच में विलम्ब</text><text x="93.0" y="100.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">नहीं</text><text x="263" y="52" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#a4400f" text-anchor="middle">खुले मुँह से नहीं</text><rect x="186" y="64" width="154" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="263.0" y="82.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">हास्य</text><rect x="186" y="98" width="154" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="263.0" y="116.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">क्षव</text><rect x="186" y="132" width="154" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="263.0" y="150.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">उद्गार</text><rect x="186" y="166" width="154" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="263.0" y="184.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">विजृंभण</text></svg>