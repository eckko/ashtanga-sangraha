<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 212" role="img"><title>Chain of three steps, the second alternative only: through excessive intensity the fire digests even the dhatus; then their depletion; then from depletion the wind</title><rect width="360" height="212" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">श्लोक २८: दूसरा विकल्प (अथवा)</text><rect x="40" y="40" width="280" height="48" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="59.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">अत्यधिक प्रबल होकर धातुओं को भी</text><text x="180.0" y="77.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">पचाती है</text><line x1="180" y1="88" x2="180" y2="104" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,110 174,101 186,101" fill="#a4400f"/><rect x="40" y="112" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="131.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">तब उन धातुओं का क्षय</text><line x1="180" y1="142" x2="180" y2="158" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,164 174,155 186,155" fill="#a4400f"/><rect x="40" y="166" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="185.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">क्षय से मरुत् (वायु) …</text></svg>