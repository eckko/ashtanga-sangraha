<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 246" role="img"><title>Two columns of unit 81: first, ghee cooked with śāli root and anointing the yoni with it; then fumigation with kaṭukālābu (probable), jālinī (disputed), nimba (neem, standard) and snake slough.</title><rect width="360" height="246" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">इकाई ८१: अभ्यंग, फिर धूपन</text><text x="93" y="52" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">पहले: अभ्यंग</text><rect x="16" y="64" width="154" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="93.0" y="82.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">शालि-मूल से</text><text x="93.0" y="100.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">सिद्ध घी</text><rect x="16" y="116" width="154" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="93.0" y="134.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">उससे योनि का</text><text x="93.0" y="152.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">अभ्यंग</text><text x="263" y="52" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#a4400f" text-anchor="middle">फिर: धूपन</text><rect x="186" y="64" width="154" height="46" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="263.0" y="82.0" font-family="'Noto Sans Devanagari','M