<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 356" role="img"><title>Chain of unit 97 in printed order: food eaten by rule; drawn into the koṣṭha by prāṇa; its mass broken by liquids; softened by sneha; lying in the āmāśaya; the agni kindled by samāna cooks it, like water and rice in a pot.</title><rect width="360" height="356" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">इकाई ९७: हाँडी में पानी-चावल जैसे</text><rect x="40" y="40" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="59.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">विधि से खाया अन्न</text><line x1="180" y1="70" x2="180" y2="86" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,92 174,83 186,83" fill="#a4400f"/><rect x="40" y="94" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="113.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">प्राण वायु ने कोष्ठ में खींचा</text><line x1="180" y1="124" x2="180" y2="140" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,146 174,137 186,137" fill="#a4400f"/><rect x="40" y="148" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="167.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">द्रवों से संघात टूटा</text><line x1="180" y1="178" x2="180" y2="194" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,200 174,191 186,191" fill="#a4400f"/><rect x="40" y="202" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="221.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">स्नेह से नरम हुआ</text><line x1="180" y1="232" x2="180" y2="248" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,254 174,245 186,245" fill="#a4400f"/><rect x="40" y="256" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="275.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">आमाशय में स्थित</text><line x1="180" y1="286" x2="180" y2="302" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,308 174,299 186,299" fill="#a4400f"/><rect x="40" y="310" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="329.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">समान से सुलगी अग्नि पकाती है</text></svg>