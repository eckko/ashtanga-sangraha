<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" role="img"><title>Chain across units 59 to 61: unit 59, from the mother's heart through the vessels to the apara; unit 60, then in sequence towards the navel (no verb printed); unit 61, cooked in the embryo's pakvashaya.</title><rect width="360" height="230" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">रस का मार्ग (इकाई ५९-६१)</text><rect x="40" y="40" width="280" height="48" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="59.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">इकाई ५९: माता के हृदय से धमनियों</text><text x="180.0" y="77.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">द्वारा अपरा तक</text><line x1="180" y1="88" x2="180" y2="104" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,110 174,101 186,101" fill="#a4400f"/><rect x="40" y="112" width="280" height="48" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="131.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">इकाई ६०: फिर क्रम से नाभि की ओर</text><text x="180.0" y="149.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">(क्रिया नहीं छपी)</text><line x1="180" y1="160" x2="180" y2="176" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,182 174,173 186,173" fill="#a4400f"/><rect x="40" y="184" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="203.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',