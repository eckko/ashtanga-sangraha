<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 284" role="img"><title>Chain of card 34: all diseases kill one whose voice, body-tissues, strength and fire are wasted, by head disease, distaste for food, breathlessness, meha, loose stool, thirst and giddiness.</title><rect width="360" height="284" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">कार्ड ३४: किनसे, कौन, किसे</text><rect x="40" y="40" width="280" height="48" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="59.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">किनसे (क्रम से): १ शिरोरोग २ अरुचि</text><text x="180.0" y="77.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">३ श्वास ४ मेह</text><line x1="180" y1="88" x2="180" y2="104" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,110 174,101 186,101" fill="#a4400f"/><rect x="40" y="112" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="131.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">५ विद्भेद् ६ तृड् ७ भ्रम</text><line x1="180" y1="142" x2="180" y2="158" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,164 174,155 186,155" fill="#a4400f"/><rect x="40" y="166" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="185.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">सर्वामयाः घ्नन्ति (सम्भवतः इनसे)</text><line x1="180" y1="196" x2="180" y2="212" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,218 174,209 186,209" fill="#a4400f"/><rect x="40" y="220" width="280" height="48" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="239.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">किसे: जिसके स्वर, धातु, बल, अनल</text><text x="180.0" y="257.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">क्षीण</text></svg>