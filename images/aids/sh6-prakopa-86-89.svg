<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 266" role="img"><title>Chain of units 86 to 89: these spaces; agitated, they agitate the dhātus; they too agitate those and the srotas; the srotas and dhātus agitate the dhātus. The verb is carried from unit 87.</title><rect width="360" height="266" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">इकाई ८६-८९: प्रकोप की कड़ी</text><rect x="40" y="40" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="59.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">८६: ते च अवकाशाः</text><line x1="180" y1="70" x2="180" y2="86" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,92 174,83 186,83" fill="#a4400f"/><rect x="40" y="94" width="280" height="48" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="113.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">८७: प्रकुपित होकर धातुओं को</text><text x="180.0" y="131.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">प्रकुपित करते हैं</text><line x1="180" y1="142" x2="180" y2="158" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,164 174,155 186,155" fill="#a4400f"/><rect x="40" y="166" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="185.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">८८: वे भी उन्हें और स्रोतसों को</text><line x1="180" y1="196" x2="180" y2="212" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,218 174,209