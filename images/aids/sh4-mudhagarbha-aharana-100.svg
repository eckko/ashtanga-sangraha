<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 356" role="img"><title>Chain of unit 100: the woman lies face up; thighs bent; hip region raised by a cloth cumbhala (probably a pad); hand and yoni anointed with dhanvanāgamṛttikā (unclear), śālmalī-picchā and ghee; extract the fetus.</title><rect width="360" height="356" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">इकाई १००: लिटाना, चुपड़ना, निकालना</text><rect x="40" y="40" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="59.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">स्त्री उत्तान (चित) लेटी</text><line x1="180" y1="70" x2="180" y2="86" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,92 174,83 186,83" fill="#a4400f"/><rect x="40" y="94" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="113.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">जाँघें मुड़ी हुईं</text><line x1="180" y1="124" x2="180" y2="140" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,146 174,137 186,137" fill="#a4400f"/><rect x="40" y="148" width="280" height="48" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="167.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">कटि वस्त्र-चुम्भल से उठी (सम्भवतः</text><text x="180.0" y="185.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">गद्दी)</text><line x1="180" y1="196" x2="180" y2="212" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,218 174,209 186,209" fill="#a4400f"/><rect x="40" y="220" width="280" height="66" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="239.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">हाथ और योनि चुपड़ें:</text><text x="180.0" y="257.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">धन्वनागमृत्तिका (अस्पष्ट),</text><text x="180.0" y="275.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">शाल्मली-पिच्छा, घी</text><line x1="180" y1="286" x2="180" y2="302" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,308 174,299 186,299" fill="#a4400f"/><rect x="40" y="310" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="329.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">गर्भ को निकाले</text></svg>