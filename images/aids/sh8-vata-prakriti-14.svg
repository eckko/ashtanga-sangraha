<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" role="img"><title>Table of unit 14 in printed order: body thin and dry with thin, scanty limbs, teeth, nails, hair, eyes and voice; noisy joints; quick to begin, be agitated, grasp and forget; unsteady; thief, ignoble, envious, senses unconquered; fond of music (probable), legends, laughter, play, quarrel, hunting, gardens, journeys; desires unctuous, hot, sweet, sour (conjectural reading) and salty.</title><rect width="360" height="520" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">इकाई १४: वातप्रकृति</text><text x="100" y="46" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12" font-weight="700" fill="#a4400f" text-anchor="middle">क्रम</text><text x="262" y="46" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12" font-weight="700" fill="#a4400f" text-anchor="middle">लक्षण</text><rect x="20" y="62" width="160" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="80.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">१ शरीर</text><rect x="190" y="62" width="150" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="80.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">तनु, रूक्ष</text><rect x="20" y="98" width="160" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="125.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">२ अंग आदि</text><rect x="190" y="98" width="150" height="46" rx="8" fill="#fffdf8" stroke="#a440