<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 232" role="img"><title>Table of unit 137: views on how long food takes to become śukra: some, a day and night; others, six days; still others, period not clear; a month is printed and may belong to them.</title><rect width="360" height="232" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">अन्न से शुक्रत्व: मत (इकाई १३७)</text><text x="100" y="46" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12" font-weight="700" fill="#a4400f" text-anchor="middle">कौन</text><text x="262" y="46" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12" font-weight="700" fill="#a4400f" text-anchor="middle">कितने समय में</text><rect x="20" y="62" width="160" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="80.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">केचित् (कुछ)</text><rect x="190" y="62" width="150" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="80.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">अहोरात्र से</text><rect x="20" y="98" width="160" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="116.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">अपरे (दूसरे)</text><rect x="190" y="98" width="150" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="116.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="midd