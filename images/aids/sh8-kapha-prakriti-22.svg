<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 592" role="img"><title>Table of the sure marks of unit 22 in printed order: colour of any one of dūrvā (standard), indīvara (probable) or śara stalk (probable); full, handsome body; large forehead, thighs (or: broad), arms; eyes with distinct white and dark; voice like lion, drum, cloud; endures hunger, thirst, heat; firm hidden enmity; gentle, truthful; memory, steadiness, not greedy; not crying even in childhood; desires pungent, bitter, astringent, hot, dry.</title><rect width="360" height="592" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">इकाई २२: कफप्रकृति (मुख्य लक्षण)</text><text x="100" y="46" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12" font-weight="700" fill="#a4400f" text-anchor="middle">क्रम</text><text x="262" y="46" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12" font-weight="700" fill="#a4400f" text-anchor="middle">लक्षण</text><rect x="20" y="62" width="160" height="82" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="107.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">१ वर्ण</text><rect x="190" y="62" width="150" height="82" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="80.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">दूर्वेदीवर (पढ़ा</text><text x="265.0" y="98.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">दूर्वा, मानक; इन्दीवर,</text><text x="265.0" y="116.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">सम्भावित) या शरकाण्ड</text><text x="265.0" y="134.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">(सम्भावित)</text><rect x="20" y="152" width="160" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="170.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">२ गात्र</text><rect x="190" y="152" width="150" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="170.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">परिपूर्ण, चारु</text><rect x="20" y="188" width="160" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="215.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">३ महा</text><rect x="190" y="188" width="150" height="46" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="206.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">ललाट, उरु (जाँघ या</text><text x="265.0" y="224.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">चौड़ा), बाहु</text><rect x="20" y="242" width="160" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="269.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">४ नेत्र</text><rect x="190" y="242" width="150" height="46" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="260.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">सित-असित व्यक्त, आयत,</text><text x="265.0" y="278.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">विशाल</text><rect x="20" y="296" width="160" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="314.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">५ घोष</text><rect x="190" y="296" width="150" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="314.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">सिंह, मृदंग, घन जैसा</text><rect x="20" y="332" width="160" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="350.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">६ सहन</text><rect x="190" y="332" width="150" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="350.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">क्षुत्, पिपासा, उष्ण</text><rect x="20" y="368" width="160" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="386.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">७ वैर</text><rect x="190" y="368" width="150" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="386.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">दृढ, प्रच्छन्न</text><rect x="20" y="404" width="160" height="64" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="440.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">८ स्वभाव</text><rect x="190" y="404" width="150" height="64" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="422.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">पेशल, सत्यवादी,</text><text x="265.0" y="440.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">स्मृतिमान्, धृतिमान्,</text><text x="265.0" y="458.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">अलोलुप</text><rect x="20" y="476" width="160" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="494.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">९ बाल्य में</text><rect x="190" y="476" width="150" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="494.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">अरोदन</text><rect x="20" y="512" width="160" height="64" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="548.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">१० इच्छा</text><rect x="190" y="512" width="150" height="64" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="530.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">कटु, तित्त (पढ़ा</text><text x="265.0" y="548.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">तिक्त), कषाय, उष्ण,</text><text x="265.0" y="566.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">रूक्ष</text></svg>