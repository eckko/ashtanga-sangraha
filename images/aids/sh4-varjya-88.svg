<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 452" role="img"><title>Two columns of unit 88. The woman, signs in line order: sense-objects reversed; convulsion; slipping of the yoni; saṃvaraṇa (sense unclear); makkala (sense unclear); śvāsa; giddiness; cold body; foul belching. Instruction: one should avoid her; in what respect is not stated.</title><rect width="360" height="452" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">इकाई ८८: किसे छोड़े</text><text x="93" y="52" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">ऐसी स्त्री (क्रम से)</text><rect x="16" y="64" width="154" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="93.0" y="82.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">१ इन्द्रिय-विषय</text><text x="93.0" y="100.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">उलटे</text><rect x="16" y="116" width="154" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="93.0" y="134.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">२ आक्षेप (ऐंठन)</text><rect x="16" y="150" width="154" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="93.0" y="168.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">३ योनि का खिसकना</text><rect x="16" y="184" width="154" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="93.0" y="202.0" font-family="'Noto Sans Devanagari','Muk