<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 736" role="img"><title>Numbered table of card 2: the alternative signs, in printed order, in twelve rows (rows 2 and 3 are one yasya clause joined by vā): disease with all causes and signs to excess; face marks (probable identifications); flowers on nails and teeth and veins on the belly; eye coating and swellings; unappeased hunger or thirst; frothy blood; śleṣman (Kapha) blue, yellow, red; neck, tongue, throat signs; parikartikā of āmāśaya; of pakvāśaya; gurgling in the throat; thirst and heart pain; all closing in sa parāsuḥ.</title><rect width="360" height="736" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">कार्ड २: ‘यस्य’ लक्षण → स परासुः</text><text x="100" y="46" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12" font-weight="700" fill="#a4400f" text-anchor="middle">क्रम</text><text x="262" y="46" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12" font-weight="700" fill="#a4400f" text-anchor="middle">लक्षण</text><rect x="20" y="62" width="160" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="89.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">१</text><rect x="190" y="62" width="150" height="46" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="80.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">रोग सब हेतु, पूर्वरूप,</text><text x="265.0" y="98.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">रूप सहित अत्यधिक</text><rect x="20" y="116" width="160" height="64" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="152.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">२</text><rect x="190" y="116" width="150" height="64" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="134.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">मुख पर पिप्लु, व्यंग,</text><text x="265.0" y="152.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">लेखा, तिलकालक</text><text x="265.0" y="170.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">(सम्भावित)</text><rect x="20" y="188" width="160" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="215.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">३</text><rect x="190" y="188" width="150" height="46" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="206.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">नख-दाँत पर पुष्प; पेट</text><text x="265.0" y="224.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">पर अनेक रंग की सिराएँ</text><rect x="20" y="242" width="160" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="269.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">४</text><rect x="190" y="242" width="150" height="46" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="260.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">नेत्रोपदेह; पलक या नाक</text><text x="265.0" y="278.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">की सूजन</text><rect x="20" y="296" width="160" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="323.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">५</text><rect x="190" y="296" width="150" height="46" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="314.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">भूख-प्यास अन्न-पान से</text><text x="265.0" y="332.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">शान्त न हो</text><rect x="20" y="350" width="160" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="377.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">६</text><rect x="190" y="350" width="150" height="46" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="368.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">झाग सहित रक्त; कुक्षि,</text><text x="265.0" y="386.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">छाती में शूल</text><rect x="20" y="404" width="160" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="431.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">७</text><rect x="190" y="404" width="150" height="46" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="422.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">श्लेष्मा नीला, पीला,</text><text x="265.0" y="440.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">लाल</text><rect x="20" y="458" width="160" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="485.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">८</text><rect x="190" y="458" width="150" height="46" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="476.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">गर्दन का अवमर्द, जीभ</text><text x="265.0" y="494.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">सूखे, पाक</text><rect x="20" y="512" width="160" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="530.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">९</text><rect x="190" y="512" width="150" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="530.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">आमाशय से परिकर्तिका</text><rect x="20" y="548" width="160" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="566.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">१०</text><rect x="190" y="548" width="150" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="566.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">पक्वाशय से परिकर्तिका</text><rect x="20" y="584" width="160" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="611.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">११</text><rect x="190" y="584" width="150" height="46" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="602.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">कण्ठ में वायु का</text><text x="265.0" y="620.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">घुरघुरक</text><rect x="20" y="638" width="160" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="665.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">१२</text><rect x="190" y="638" width="150" height="46" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="656.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">प्यास बढ़े, हृदय में</text><text x="265.0" y="674.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">शूल</text><rect x="20" y="692" width="160" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="710.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">फल</text><rect x="190" y="692" width="150" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="710.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">स परासुः</text></svg>