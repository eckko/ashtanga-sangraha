<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 718" role="img"><title>Numbered table of card 2: twelve alternative signs, each opened by yasya, in printed order (disease with all causes and signs to excess; face marks; flowers on nails and teeth and veins on the belly; eye coating and swellings; unappeased hunger or thirst; frothy blood; coloured phlegm; neck, tongue, throat signs; parikartikā of āmāśaya; of pakvāśaya; gurgling in the throat; thirst and heart pain), all closing in sa parāsuḥ.</title><rect width="360" height="718" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">कार्ड २: ‘यस्य’ लक्षण → स परासुः</text><text x="100" y="46" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12" font-weight="700" fill="#a4400f" text-anchor="middle">क्रम</text><text x="262" y="46" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12" font-weight="700" fill="#a4400f" text-anchor="middle">लक्षण</text><rect x="20" y="62" width="160" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="89.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">१</text><rect x="190" y="62" width="150" height="46" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="80.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">रोग सब हेतु, पूर्वरूप,</text><text x="265.0" y="98.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">रूप सहित अत्यधिक</text><rect x="20" y="116" width="160" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="10