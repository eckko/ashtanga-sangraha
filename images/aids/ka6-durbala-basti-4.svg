<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 284" role="img"><title>Chain of four steps: a basti that is cold, or has little oil, salt, drug and quantity, or is thick; it agitates the dosha; through weakness it does not expel it; the result follows in verse 5</title><rect width="360" height="284" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">श्लोक ४: दुर्बल बस्ति</text><rect x="40" y="40" width="280" height="66" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="59.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">ठंडी, या अल्प</text><text x="180.0" y="77.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">स्नेह-लवण-द्रव्य-मात्रा वाली, या</text><text x="180.0" y="95.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">गाढ़ी बस्ति</text><line x1="180" y1="106" x2="180" y2="122" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,128 174,119 186,119" fill="#a4400f"/><rect x="40" y="130" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="149.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">दोष को क्षुब्ध करती है</text><line x1="180" y1="160" x2="180" y2="176" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,182 174,173 186,173" fill="#a4400f"/><rect x="40" y="184" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="203.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">दुर्बलता से उसे नहीं निकालती</text><line x1="180" y1="214" x2="180" y2="230" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,236 174,227 186,227" fill="#a4400f"/><rect x="40" y="238" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="257.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">परिणाम: श्लोक ५</text></svg>