<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 338" role="img"><title>Chain of unit 60: names from talahṛdaya to sīmanta (vakṣomarma as printed); thirty-three; take life after an interval; reason: both saumya and āgneya; time: within a fortnight.</title><rect width="360" height="338" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">इकाई ६०: कालान्तर-प्राणहर</text><rect x="40" y="40" width="280" height="48" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="59.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">नाम: तलहृदय से सीमन्त तक</text><text x="180.0" y="77.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">(वक्षोमर्म छपे रूप में)</text><line x1="180" y1="88" x2="180" y2="104" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,110 174,101 186,101" fill="#a4400f"/><rect x="40" y="112" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="131.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">त्रयस्त्रिंशत्: तैंतीस</text><line x1="180" y1="142" x2="180" y2="158" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,164 174,155 186,155" fill="#a4400f"/><rect x="40" y="166" width="280" height="48" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="185.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">कालान्तर-प्राणहर: कुछ समय बाद</text><text x="180.0" y="203.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size