ु</text><line x1="180" y1="232" x2="180" y2="248" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,254 174,245 186,245" fill="#a4400f"/><rect x="40" y="256" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="275.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">इसलिए: क्षण भर भी देर नहीं</text></svg>