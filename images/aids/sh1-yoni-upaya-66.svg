<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 232" role="img"><title>Table of the pastes held in the yoni and the washes (object unstated) in the three doṣa lists by their place in the text: Vata (unit 54) paste of priyangu and tila, wash of sarala and mudgaparni; Pitta (units 60-61) paste of candana and payasya, wash of gairika and arishta; Kapha (units 65-66) paste of madanaphala, wash of an unclear decoction or goat and sheep urine.</title><rect width="360" height="232" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">धारण और प्रक्षालन, दोष-क्रम से</text><text x="100" y="46" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12" font-weight="700" fill="#a4400f" text-anchor="middle">क्रम (इकाई)</text><text x="262" y="46" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12" font-weight="700" fill="#a4400f" text-anchor="middle">कल्क · प्रक्षालन</text><rect x="20" y="62" width="160" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="89.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">वातज (५४)</text><rect x="190" y="62" width="150" height="46" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="80.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">प्रियंगु-तिल ·</text><text x="265.0" y="98.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">सरल-मुद्गपर्णी</text><rect x="20" y="116" width="160" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="143.0" font-family="'Noto Sans Deva