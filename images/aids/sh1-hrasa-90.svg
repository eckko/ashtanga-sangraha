<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 178" role="img"><title>Split of units 89 and 90: in these nights the endowment grows progressively; after this, life-span and the rest decrease progressively.</title><rect width="360" height="178" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">बढ़त और ह्रास (इकाई ८९-९०)</text><text x="93" y="52" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">इन रातों में (इकाई ८९)</text><rect x="16" y="64" width="154" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="93.0" y="82.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">उत्तरोत्तर</text><text x="93.0" y="100.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">सम्पदा</text><rect x="16" y="116" width="154" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="93.0" y="134.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">आयु, आरोग्य, बल</text><text x="93.0" y="152.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">आदि</text><text x="263" y="52" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#a4400f" text-anchor="middle">इसके आगे (इकाई ९०)</text><rect x="186" y="64" width="154" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="263.0" y="82.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">उत्तरोत्तर ह्रास</text><rect x="186" y="98" width="154" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="263.0" y="116.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">आयु आदि का</text></svg>