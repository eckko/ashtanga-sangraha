<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 108" role="img"><title>Two columns for unit 7, joined by or: the embryo perishes even at conception, or it becomes abnormal.</title><rect width="360" height="108" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">इकाई ७: वा ... वा, दो विकल्प</text><text x="93" y="52" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">विपद्यते</text><rect x="16" y="64" width="154" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="93.0" y="82.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">संभव में ही नष्ट</text><text x="263" y="52" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#a4400f" text-anchor="middle">विकृतो भवति</text><rect x="186" y="64" width="154" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="263.0" y="82.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">विकृत हो जाता है</text></svg>