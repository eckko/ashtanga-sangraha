 UI','Mangal','FreeSans',sans-serif;}#mm6174df7e .slice{font-family:'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal','FreeSans',sans-serif;fill:#2a2118;font-size:14px;}#mm6174df7e .legend text{fill:#2a2118;font-family:'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal','FreeSans',sans-serif;font-size:14px;}#mm6174df7e .node .neo-node{stroke:#2f6f6a;}#mm6174df7e [data-look="neo"].node rect,#mm6174df7e [data-look="neo"].cluster rect,#mm6174df7e [data-look="neo"].node polygon{stroke:url(#mm6174df7e-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mm6174df7e [data-look="neo"].swimlane.cluster rect{filter:none;}#mm6174df7e [data-look="neo"].node path{stroke:url(#mm6174df7e-gradient);stroke-width:1px;}#mm6174df7e [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mm6174df7e [data-look="neo"].node .neo-line path{stroke:#2f6f6a;filter:none;}#mm6174df7e [data-look="neo"].node circle{stroke:url(#mm6174df7e-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mm6174df7e [data-look="neo"].node circle .state-start{fill:#000000;}#mm6174df7e [data-look="neo"].icon-shape .icon{fill:url(#mm6174df7e-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mm6174df7e [data-look="neo"].icon-shape .icon-neo path{stroke:url(#mm6174df7e-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mm6174df7e .eventWrapper{filter:none;}#mm6174df7e .titleText{fill:rgb(47, 111, 106);font-weight:700;}#mm6174df7e :root{--mermaid-font-family:'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal','FreeSans',sans-serif;}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="185.5" class="pieOuterCircle"/><path d="M0,-185A185,185,0,1,1,-160.215,92.5L0,0Z" fill="#e3efec" class="pieCircle"/><path d="M-160.215,92.5A185,185,0,0,1,-86.852,-163.345L0,0Z" fill="#f6e4d6" class="pieCircle"/><path d="M-86.852,-163.345A185,185,0,0,1,0,-185L0,0Z" fill="#f4ecc9" class="pieCircle"/><text transform="translate(112.