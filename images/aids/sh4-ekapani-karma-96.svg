<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 346" role="img"><title>Two columns of unit 96. Among (in line order): yoni, liver, spleen, intestines, womb, and the like. With one hand, eight operations numbered in line order: pulling up, pulling down, turning round, cutting out, cutting through, splitting, pressing, straightening.</title><rect width="360" height="346" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">इकाई ९६: अंगों के बीच, एक हाथ से</text><text x="93" y="52" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">किनके बीच (क्रम से)</text><rect x="16" y="64" width="154" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="93.0" y="82.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">योनि</text><rect x="16" y="98" width="154" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="93.0" y="116.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">यकृत्</text><rect x="16" y="132" width="154" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="93.0" y="150.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">प्लीहा</text><rect x="16" y="166" width="154" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="93.0" y="184.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">अन्त्र (आँतें)</text><rect x="16" y="200" width="154" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><te