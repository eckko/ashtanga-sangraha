<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 176" role="img"><title>Split of unit 19: what rakshas can take away (ojas) against what they cannot (the body), for undesirability or incapacity.</title><rect width="360" height="176" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">राक्षस क्या हर सकते हैं? (इकाई १९)</text><text x="93" y="52" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">सम्भव</text><rect x="16" y="64" width="154" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="93.0" y="82.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">ओज (जीवन-सार)</text><text x="263" y="52" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#a4400f" text-anchor="middle">सम्भव नहीं</text><rect x="186" y="64" width="154" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="263.0" y="82.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">काय (शरीर)</text><rect x="186" y="98" width="154" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="263.0" y="116.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">कारण: अनिष्टता</text><rect x="186" y="132" width="154" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="263.0" y="150.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">या असमर्थता</text></svg>