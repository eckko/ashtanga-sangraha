<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 358" role="img"><title>Table of unit 102, five presentations in line order with their handling: one thigh presented, stretch out the other thigh; come at the buttock region, press it down, lift upward, stretch the thighs; come transversely, turn round, or lift the hind half (corrected reading); head turned to the side, press the shoulder, lift, bring the head to the passage; both arms presented, press both shoulders up, bring the base of the head. Then draw out.</title><rect width="360" height="358" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">इकाई १०२: पाँच दशाएँ, फिर निर्हरेत्</text><text x="100" y="46" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12" font-weight="700" fill="#a4400f" text-anchor="middle">दशा (क्रम से)</text><text x="262" y="46" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12" font-weight="700" fill="#a4400f" text-anchor="middle">उपाय</text><rect x="20" y="62" width="160" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="80.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">१ एक जाँघ आगे</text><rect x="190" y="62" width="150" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="80.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">दूसरी जाँघ फैलाकर</text><rect x="20" y="98" width="160" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="116.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">२ नितम्ब-प्रदेश से</text><text x="100.0" y="134.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">आया</text><rect x="190" y="98" width="150" height="46" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="116.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">दबाकर, ऊपर उठाकर,</text><text x="265.0" y="134.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">जाँघें फैलाकर</text><rect x="20" y="152" width="160" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="179.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">३ तिरछा आया</text><rect x="190" y="152" width="150" height="46" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="170.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">घुमाकर; या पिछला आधा</text><text x="265.0" y="188.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">उठाकर (सुधारा पाठ)</text><rect x="20" y="206" width="160" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="224.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">४ सिर बगल में</text><text x="100.0" y="242.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">मुड़ा</text><rect x="190" y="206" width="150" height="46" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="224.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">कन्धा दबाकर, उठाकर,</text><text x="265.0" y="242.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">सिर मार्ग में लाकर</text><rect x="20" y="260" width="160" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="287.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">५ दोनों भुजाएँ आगे</text><rect x="190" y="260" width="150" height="46" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="278.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">दोनों कन्धे ऊपर दबाकर,</text><text x="265.0" y="296.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">सिर की जड़ लाकर</text><rect x="20" y="314" width="160" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="332.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">अन्त में</text><rect x="190" y="314" width="150" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="332.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">निर्हरेत्: निकाले</text></svg>