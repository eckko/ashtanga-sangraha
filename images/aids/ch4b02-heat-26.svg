<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 194" role="img"><title>Chain: in the cold the cold wind strikes; the heats of the body enter inside; the fire in the belly is made strong</title><rect width="360" height="194" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">श्लोक २६: शीत में देह की ऊष्मा</text><rect x="40" y="40" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="59.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">शीत में ठंडी वायु का आघात</text><line x1="180" y1="70" x2="180" y2="86" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,92 174,83 186,83" fill="#a4400f"/><rect x="40" y="94" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="113.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">देह की ऊष्माएँ भीतर प्रवेश</text><line x1="180" y1="124" x2="180" y2="140" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,146 174,137 186,137" fill="#a4400f"/><rect x="40" y="148" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="167.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">पेट की अग्नि प्रबल</text></svg>