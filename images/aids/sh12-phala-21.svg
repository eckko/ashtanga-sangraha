<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 268" role="img"><title>Table of card 21: the first five kinds are fruitless; six more listed after tathā have no printed predicate; a dream in the first part of the night gives little fruit, after a long time.</title><rect width="360" height="268" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">कार्ड २१: स्वप्न और फल</text><text x="100" y="46" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12" font-weight="700" fill="#a4400f" text-anchor="middle">स्वप्न</text><text x="262" y="46" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12" font-weight="700" fill="#a4400f" text-anchor="middle">पंक्ति क्या कहती है</text><rect x="20" y="62" width="160" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="80.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">पहले पाँच प्रकार</text><rect x="190" y="62" width="150" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="80.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">अफल: निष्फल</text><rect x="20" y="98" width="160" height="118" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="116.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">तथा: प्रकृति</text><text x="100.0" y="134.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">अनुसार, विस्मृत,</text><text x="100.0" y="152.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">दिन का, अतिह्रस्व,</text><text x="100.0" y="170.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">अतिदीर्घ,</text><text x="100.0" y="188.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">नातिसुप्तदृष्ट (दो</text><text x="100.0" y="206.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">अर्थ सम्भव)</text><rect x="190" y="98" width="150" height="118" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="161.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">विधेय नहीं छपा</text><rect x="20" y="224" width="160" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="242.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">रात्रि का पहला भाग</text><rect x="190" y="224" width="150" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="242.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">थोड़ा फल, देर से</text></svg>