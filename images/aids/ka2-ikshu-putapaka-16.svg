<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 302" role="img"><title>Chain of five steps across verses 15 and 16: split the sugarcane piece in two, smear its inside with trivrt, join it into one, steam it by puta-cooking, eat it</title><rect width="360" height="302" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">श्लोक १५-१६: गन्ने में त्रिवृत्</text><rect x="40" y="40" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="59.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">गन्ने का खण्ड दो भाग (श्लोक १५)</text><line x1="180" y1="70" x2="180" y2="86" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,92 174,83 186,83" fill="#a4400f"/><rect x="40" y="94" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="113.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">भीतर त्रिवृत् का लेप (श्लोक १५)</text><line x1="180" y1="124" x2="180" y2="140" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,146 174,137 186,137" fill="#a4400f"/><rect x="40" y="148" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="167.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">फिर एक करना</text><line x1="180" y1="178" x2="180" y2="194" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,200 174,191 186,191" fill="#a4400f"/><rect x="40" y="202" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="221.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">पुटपाक से भाप में पकाना</text><line x1="180" y1="232" x2="180" y2="248" stroke="#a4400f" stroke-width="2.5"/><polygon points="180,254 174,245 186,245" fill="#a4400f"/><rect x="40" y="256" width="280" height="30" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="180.0" y="275.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">खाना</text></svg>