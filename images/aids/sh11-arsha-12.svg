र</text><rect x="20" y="134" width="160" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="152.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">३</text><rect x="190" y="134" width="150" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="152.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">नाभि</text><rect x="20" y="170" width="160" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="188.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">४</text><rect x="190" y="170" width="150" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="188.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">गुद: गुदा</text><rect x="20" y="206" width="160" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="224.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">५</text><rect x="190" y="206" width="150" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="265.0" y="224.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">मुष्क: वृषण</text><rect x="20" y="242" width="160" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="100.0" y="260.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">६</text><rect x="190" y="242" width="150" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text 