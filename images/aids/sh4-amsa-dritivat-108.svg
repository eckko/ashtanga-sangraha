<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 212" role="img"><title>Two columns of unit 108: stuck at the shoulder, cut off the arm at the shoulder region; swollen like a skin-bag, in order: split open the wind-filled belly, cast out the intestines, extract when slack.</title><rect width="360" height="212" rx="14" fill="#fffdf8" stroke="#e4d9c6"/><text x="180" y="22" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">इकाई १०८: दो दशाएँ</text><text x="93" y="52" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#2f6f6a" text-anchor="middle">कन्धे में अटका</text><rect x="16" y="64" width="154" height="46" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="93.0" y="82.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">कन्धे के स्थान</text><text x="93.0" y="100.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">पर</text><rect x="16" y="116" width="154" height="28" rx="8" fill="#fffdf8" stroke="#2f6f6a"/><text x="93.0" y="134.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">भुजा काटकर</text><text x="263" y="52" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="13" font-weight="700" fill="#a4400f" text-anchor="middle">मशक-सा फूला</text><rect x="186" y="64" width="154" height="46" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="263.0" y="82.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">१ वायु-भरा पेट</text><text x="263.0" y="100.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">चीरकर</text><rect x="186" y="116" width="154" height="28" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="263.0" y="134.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">२ आँतें निकालकर</text><rect x="186" y="150" width="154" height="46" rx="8" fill="#fffdf8" stroke="#a4400f"/><text x="263.0" y="168.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">३ ढीला होने पर</text><text x="263.0" y="186.0" font-family="'Noto Sans Devanagari','Mukta','Nirmala UI','Mangal',sans-serif" font-size="12.5" font-weight="500" fill="#2a2118" text-anchor="middle">निकाले</text></svg>